<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sergio Tacchini — Fit Guide</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --white: #ffffff;
            --off-white: #F0EFE9;
            --bg: #F5F4F0;
            --border: #E0DED8;
            --text-primary: #1A1A1A;
            --text-secondary: #6B6B6B;
            --text-muted: #A8A8A8;
            --accent: #2D4A3E;
            --accent-l: #E8F0EC;
            --accent-m: #4A7C68;
            --tag-line-bg: #2D4A3E;
            --tag-line-color: #ffffff;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.07);
            --shadow-md: 0 4px 20px rgba(0,0,0,0.10);
            --radius: 8px;
            --mono: 'Pretendard', sans-serif;
            --sans: 'Pretendard', sans-serif;
        }

        body {
            font-family: 'Pretendard', sans-serif !important;
            background: var(--bg);
            color: var(--text-primary);
        }

        /* ── HEADER ── */
        header {
            background: var(--accent);
            border-bottom: none;
            padding: 22px 40px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 14px;
        }
        .header-brand {
            font-family: var(--sans);
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.5);
        }
        .header-title {
            font-family: var(--sans);
            font-size: 20px;
            font-weight: 500;
            letter-spacing: 0.1em;
            color: #fff;
            margin-top: 4px;
        }
        .header-title .emoji { display: none; }
        .header-meta {
            font-family: var(--sans);
            font-size: 9px;
            color: rgba(255,255,255,0.3);
            letter-spacing: 0.1em;
            text-align: right;
        }

        /* ── LOADING SCREEN ── */
        #loading-screen {
            position: fixed; inset: 0;
            background: var(--accent);
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            transition: opacity 0.6s ease;
        }
        #loading-screen.fade-out { opacity: 0; pointer-events: none; }
        .loading-brand {
            font-family: var(--sans);
            font-size: 10px;
            font-weight: 400;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.4);
        }
        .loading-title {
            font-family: var(--sans);
            font-size: 28px;
            font-weight: 500;
            color: #fff;
            letter-spacing: 0.12em;
        }
        .loading-counter {
            font-family: var(--sans);
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 0.12em;
            color: rgba(255,255,255,0.45);
        }
        .progress-track {
            width: 200px;
            height: 2px;
            background: rgba(255,255,255,0.15);
            border-radius: 1px;
            overflow: hidden;
            margin-top: 2px;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: rgba(255,255,255,0.75);
            transition: width 0.1s linear;
        }

        /* ── FILTERS BAR (always visible after load) ── */

        /* ── FILTERS BAR ── */
        .filters-bar {
            background: #fff;
            border-bottom: 1px solid var(--border);
            padding: 14px 40px;
        }
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }
        .filter-pill {
            display: flex;
            align-items: center;
            gap: 7px;
            border: 1.5px solid var(--border);
            border-radius: 100px;
            padding: 8px 18px;
            background: #fff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .filter-pill:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0,0,0,0.06);
        }
        .filter-pill label {
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-muted);
            white-space: nowrap;
            font-family: var(--sans);
        }
        .filter-pill select,
        .filter-pill input {
            border: none;
            background: transparent;
            font-family: var(--sans);
            font-size: 12px;
            font-weight: 400;
            color: var(--text-primary);
            outline: none;
            cursor: pointer;
            min-width: 80px;
        }
        .filter-pill input { min-width: 140px; }
        .filter-pill input::placeholder { color: var(--text-muted); }

        .btn-reset {
            background: none;
            border: 1.5px solid var(--border);
            border-radius: 100px;
            padding: 9px 20px;
            font-family: var(--sans);
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 1px;
            color: var(--text-muted);
            cursor: pointer;
            transition: border-color 0.2s, color 0.2s;
        }
        .btn-reset:hover { border-color: var(--accent-m); color: var(--accent); }

        /* ── RESULTS AREA ── */
        .results-area { padding: 0 28px 48px; }

        .count-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 24px 0 16px;
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 0.3px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }
        .count-bar strong { color: var(--text-primary); font-size: 14px; font-weight: 700; }

        /* ── GRID ── */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 18px;
        }

        /* card entrance animation */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            transition: box-shadow 0.22s, border-color 0.22s, transform 0.22s;
            animation: fadeUp 0.38s ease both;
        }
        .card:hover {
            box-shadow: 0 8px 24px rgba(0,0,0,0.10);
            transform: translateY(-4px);
        }
        .card-img {
            width: 100%;
            height: 300px;
            background: var(--off-white);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-bottom: 1px solid var(--border);
            position: relative;
        }
        .qc-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(44, 44, 44, 0.92);
            color: #fff;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.05em;
            box-shadow: 0 2px 6px rgba(0,0,0,0.18);
            z-index: 2;
            font-family: var(--sans);
        }
        .modal-img, .modal-img-main { position: relative; }
        .modal-img .qc-badge, .modal-img-main .qc-badge { top: 14px; right: 14px; padding: 5px 12px; font-size: 11px; }
        .tag-qc {
            background: #2c2c2c;
            color: #fff;
            border: 1px solid #2c2c2c;
        }
        .card-img img {
            width: 100%; height: 100%;
            object-fit: contain;
            object-position: center top;
            display: block;
        }
        .card-body { padding: 12px 14px 14px; }
        .card-ref {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.08em;
            color: var(--text-primary);
            margin-bottom: 8px;
            font-family: var(--sans);
        }
        .tags { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
        .tag {
            font-size: 9px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 100px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        .tag-line  { background: var(--tag-line-bg); color: var(--tag-line-color); font-family: var(--sans); }
        .tag-men   { background: #dbeafe; color: #1d4ed8; font-family: var(--sans); }
        .tag-women { background: #fce7f3; color: #be185d; font-family: var(--sans); }
        .tag-unisex{ background: #ede9fe; color: #6d28d9; font-family: var(--sans); }

        .measures { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 10px; }
        .measure-item { font-size: 10px; color: var(--text-secondary); font-family: var(--sans); }
        .measure-item span { font-weight: 500; color: var(--text-primary); }
        .remark {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 9px;
            border-top: 1px solid var(--border);
            padding-top: 8px;
            line-height: 1.5;
            font-family: 'Pretendard', sans-serif;
        }

        /* ── MODAL ── */
        .modal-overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.45);
            backdrop-filter: blur(2px);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: #fff;
            border-radius: 10px;
            max-width: 720px;
            width: 95%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.18);
            position: relative;
            animation: fadeUp 0.28s ease;
            transition: max-width 0.2s ease;
        }
        .modal.modal-wide { max-width: 1080px; }
        .modal.modal-wide .modal-grid { grid-template-columns: 2fr 1fr; }
        .modal-img-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .modal-close {
            position: absolute; top: 18px; right: 22px;
            font-size: 18px; cursor: pointer;
            background: rgba(255,255,255,0.15); border: none;
            color: #fff; width: 28px; height: 28px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            transition: background 0.15s;
        }
        .modal-close:hover { background: rgba(255,255,255,0.25); }
        .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; padding: 28px; }
        .modal-img {
            width: 100%;
            border-radius: 8px;
            background: var(--off-white);
            display: flex; align-items: center; justify-content: center;
            color: var(--text-muted); font-size: 13px;
            min-height: 300px; overflow: hidden;
            border: 1px solid var(--border);
        }
        .modal-img img { width: 100%; object-fit: contain; object-position: center top; max-height: 420px; display: block; border-radius: 8px; }
        .modal-img-gallery { display: flex; flex-direction: column; gap: 10px; }
        .modal-img-main { width: 100%; border-radius: 8px; background: var(--off-white);
            display: flex; align-items: center; justify-content: center;
            color: var(--text-muted); font-size: 13px;
            min-height: 300px; overflow: hidden; border: 1px solid var(--border); }
        .modal-img-main img { width: 100%; object-fit: contain; object-position: center top; max-height: 420px; display: block; border-radius: 8px; }
        .modal-img-thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
        .modal-img-thumb { width: 64px; height: 64px; border-radius: 6px; border: 2px solid var(--border);
            background: var(--off-white); cursor: pointer; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            transition: border-color 0.15s; padding: 0; }
        .modal-img-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .modal-img-thumb:hover { border-color: var(--text-muted); }
        .modal-img-thumb.active { border-color: var(--text-primary); }
        .modal-info h2 { font-size: 15px; font-weight: 500; margin-bottom: 8px; font-family: var(--sans); letter-spacing: 0.06em; }
        .modal-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        .modal-table tr td { padding: 5px 8px; font-size: 11px; border-bottom: 1px solid var(--border); font-family: var(--sans); }
        .modal-table tr td:first-child { color: var(--text-muted); width: 55%; font-family: var(--sans); }
        .modal-table tr td:last-child { font-weight: 500; color: var(--text-primary); font-family: var(--sans); }

        /* ── EMPTY STATE ── */
        .empty {
            grid-column: 1/-1;
            padding: 60px 0;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
        }


        /* ── MAIN BODY LAYOUT ── */
        .main-body { display: flex; align-items: stretch; }
        .sg-sidebar {
            width: calc(100% / 6);
            min-width: 100px;
            flex-shrink: 0;
            border-right: 1px solid var(--border);
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            background: #fff;
        }
        .sg-sidebar-title {
            font-family: var(--sans);
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        .sg-line-btn {
            width: 70%;
            min-width: 52px;
            height: 32px;
            flex-shrink: 0;
            border-radius: 6px;
            border: 1px solid var(--border);
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            background: transparent;
            color: var(--text-muted);
            font-family: var(--sans);
            transition: all 0.15s;
            letter-spacing: 0.08em;
            display: flex; align-items: center; justify-content: center;
        }
        .sg-line-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
        .sg-line-btn:hover:not(.active) { border-color: var(--accent-m); color: var(--accent); background: var(--accent-l); }

        .sg-filter-btn {
            width: 70%;
            min-width: 52px;
            height: 32px;
            flex-shrink: 0;
            border-radius: 6px;
            border: 1px solid var(--border);
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            background: transparent;
            font-family: var(--sans);
            transition: all 0.15s;
            letter-spacing: 0.08em;
            display: flex; align-items: center; justify-content: center;
        }
        /* ── 사이드바 버튼 아웃라인 스타일 ── */
        .sg-filter-btn.active,
        .sg-line-btn.active,
        .sg-b-btn.active,
        .sg-spec-btn.active,
        .sg-tab-btn.active,
        .sg-reset-btn.active {
            background: var(--off-white) !important;
            color: var(--text-primary) !important;
            border: 1.5px solid var(--text-primary) !important;
        }

        /* 비활성 기본 색상 — 전부 회색 */
        .sg-gender-btn, .sg-fit-btn, .sg-b-gender-btn,
        .sg-b-line-btn, .sg-b-fabric-btn, .sg-b-fit-btn,
        .sg-top-fabric-btn {
            color: var(--text-muted) !important;
            border-color: var(--border) !important;
        }

        /* BOTTOM 버튼 기본 */
        .sg-b-btn {
            width: 70%; min-width: 52px; height: 32px; flex-shrink: 0;
            border-radius: 6px; border: 1px solid var(--border);
            font-size: 10px; font-weight: 700; cursor: pointer;
            background: transparent; color: var(--text-muted);
            font-family: var(--sans); transition: all 0.15s;
            letter-spacing: 0.08em;
            display: flex; align-items: center; justify-content: center;
        }
        .sg-b-fit-btn { font-size: 9px; }

        /* FABRIC 태그 */
        .tag-fabric-jersey { background: #e0f2fe; color: #0369a1; }
        .tag-fabric-woven  { background: #fef9c3; color: #854d0e; }

        .sg-fit-btn { font-size: 9px; }
        .sg-sidebar-divider { width: 70%; height: 1px; background: var(--border); margin: 4px 0; }

        .sg-spec-btn {
            width: 70%;
            min-width: 52px;
            height: 52px;
            flex-shrink: 0;
            border-radius: 6px;
            border: 1px solid var(--border);
            font-size: 9px;
            font-weight: 700;
            cursor: pointer;
            background: transparent;
            color: var(--text-muted);
            font-family: var(--sans);
            transition: all 0.15s;
            letter-spacing: 0.08em;
            line-height: 1.4;
            text-align: center;
        }
        .sg-spec-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
        .sg-spec-btn:hover:not(.active) { border-color: var(--accent-m); color: var(--accent); background: var(--accent-l); }

        /* TOP / BOTTOM 탭 */
        .sg-tab-btns { display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .sg-tab-btn {
            width: 70%; min-width: 52px; height: 32px; flex-shrink: 0;
            border-radius: 6px; border: 1px solid var(--border);
            font-size: 10px; font-weight: 700; cursor: pointer;
            background: transparent; color: var(--text-muted);
            font-family: var(--sans); transition: all 0.15s; letter-spacing: 0.08em;
            display: flex; align-items: center; justify-content: center;
        }
        .sg-tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

        .sg-reset-btn {
            width: 70%;
            min-width: 52px;
            height: 32px;
            flex-shrink: 0;
            border-radius: 6px;
            border: 1px solid var(--border);
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            background: transparent;
            color: var(--text-muted);
            font-family: var(--sans);
            transition: all 0.15s;
            letter-spacing: 0.08em;
        }
        .sg-reset-btn:hover { border-color: var(--accent-m); color: var(--accent); background: var(--accent-l); }

        /* HOW TO MEASURE 탭 버튼 */
        .htm-tab-btn {
            padding: 4px 14px; border-radius: 100px;
            border: 1px solid var(--border); font-size: 10px; font-weight: 700;
            cursor: pointer; background: transparent; color: var(--text-muted);
            font-family: var(--sans); transition: all 0.15s; letter-spacing: 0.06em;
        }
        .htm-tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

        .main-content { flex: 1; min-width: 0; display: flex; flex-direction: column; }

        /* ── SIZE GUIDE INNER ── */
        .size-guide-inner {
            border-bottom: 1px solid var(--border);
            background: #fff;
            padding: 16px 28px 20px;
        }
        .sg-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
        .sg-title { font-size: 13px; font-weight: 500; letter-spacing: 0.1em; color: var(--text-primary); font-family: var(--sans); text-transform: uppercase; }
        .sg-toggle { background: none; border: 1px solid var(--border); border-radius: 100px; padding: 4px 12px; font-size: 10px; font-weight: 500; color: var(--text-muted); cursor: pointer; font-family: var(--sans); }
        .sg-content { display: none; }
        .sg-content.active { display: block; }

        /* 레이블 + 테이블 가운데 정렬 블록 */
        .sg-table-block { display: flex; flex-direction: column; align-items: center; }
        .sg-col-label { font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 6px; font-family: var(--sans); width: 36.3%; }

        .sg-table-wrap { width: 36.3%; overflow-x: auto; border-radius: 6px; border: 1px solid var(--border); margin-bottom: 14px; }
        .sg-table { width: 100%; border-collapse: collapse; font-size: 11px; }
        .sg-table thead tr { background: var(--off-white); }
        .sg-table thead th { padding: 8px 12px; text-align: center; font-weight: 500; font-size: 10px; letter-spacing: 0.08em; color: var(--text-muted); border-bottom: 1px solid var(--border); white-space: nowrap; font-family: var(--sans); }
        .sg-table thead th:first-child { text-align: left; }
        .sg-table tbody tr { border-bottom: 1px solid var(--border); }
        .sg-table tbody tr:last-child { border-bottom: none; }
        .sg-table tbody tr:hover { background: var(--off-white); }
        .sg-table tbody td { padding: 6px 12px; text-align: center; color: var(--text-primary); font-size: 11px; font-family: var(--sans); }
        .sg-table tbody td:first-child { text-align: left; font-weight: 500; color: var(--text-secondary); white-space: nowrap; font-size: 11px; font-family: var(--sans); }
        .sg-line-section-title {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.12em;
            color: var(--text-primary);
            font-family: var(--sans);
            margin-bottom: 14px;
        }
        .sg-divider { height: 1px; background: var(--border); margin: 10px 0 14px; }
        .sg-section-divider { height: 2px; background: var(--off-white); margin: 20px 0 24px; }
        .fit-pill { display: inline-block; font-size: 10px; font-weight: 500; padding: 3px 10px; border-radius: 100px; letter-spacing: 0.06em; cursor: pointer; transition: opacity 0.15s; font-family: var(--sans); }
        .fit-pill:hover { opacity: 0.75; }
        .fp-regular   { background: #ccfbf1; color: #0f766e; }
        .fp-semi-over { background: #fef3c7; color: #92400e; }
        .fp-over      { background: #fee2e2; color: #991b1b; }
        .fp-slim      { background: #ede9fe; color: #6d28d9; }
        .fp-sporty    { background: #d1fae5; color: #065f46; }
        @media(max-width: 640px) {
            header { padding: 18px 20px; }
            .main-body { flex-direction: column; }
            .sg-sidebar { width: 100%; flex-direction: row; border-right: none; border-bottom: 1px solid var(--border); padding: 10px 16px; flex-wrap: wrap; gap: 6px; }
            .results-area { padding: 0 16px 40px; }
            .grid { grid-template-columns: 1fr 1fr; gap: 12px; }
            .card-img { height: 220px; }
            .modal-grid { grid-template-columns: 1fr; }
            .sg-table-wrap { width: 100%; }

    const safeData = Array.isArray(DATA) ? DATA : [];

    function renderBottomFitBtns(line) {
        const wrap = document.getElementById('bottom-fit-btns');
        if (!wrap) return;
        const fits = BOTTOM_FIT_MAP[line] || [];
        if (!fits.length) { wrap.innerHTML = ''; return; }
        wrap.innerHTML = fits.map(f =>
            `<button class="sg-b-btn sg-b-fit-btn" data-val="${f.val}"
                onclick="toggleBottomFilter('fit','${f.val}',this)"
                style="color:${f.color};border-color:${f.border};">${f.val}</button>`
        ).join('');
    }

    function goHome() {
        // 첫 진입 화면 = 필터 초기화 + SPEC GUIDE 자동 열림 + 탭 active 해제
        resetAll();
        document.getElementById("tab-top").classList.remove("active");
        document.getElementById("tab-bottom").classList.remove("active");
        renderSizeGuide();
        document.getElementById("size-guide-inner").style.display = "block";
        document.getElementById("sg-spec-btn").classList.add("active");
    }

    function closeSpecGuide() {
        document.getElementById("size-guide-inner").style.display = "none";
        document.getElementById("sg-spec-btn").classList.remove("active");
    }

    function switchTab(tab, btn) {
        currentTab = tab;
        document.querySelectorAll('.sg-tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('top-filters').style.display    = tab === 'top'    ? 'flex' : 'none';
        document.getElementById('bottom-filters').style.display = tab === 'bottom' ? 'flex' : 'none';
        closeSpecGuide();
        resetAll();
        if (tab === 'top') renderCards(safeData);
        else renderCards(safeDataBottom);
    }

    function toggleBottomFilter(type, val, btn) {
        const btnClass = {
            gender: '.sg-b-gender-btn',
            line:   '.sg-b-line-btn',
            fabric: '.sg-b-fabric-btn',
            fit:    '.sg-b-fit-btn'
        }[type];

        closeSpecGuide();

        if (bottomFilter[type] === val) {
            bottomFilter[type] = '';
            btn.classList.remove('active');
            if (type === 'line') { bottomFilter.fit = ''; renderBottomFitBtns(''); }
        } else {
            bottomFilter[type] = val;
            document.querySelectorAll(btnClass).forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (type === 'line') { bottomFilter.fit = ''; renderBottomFitBtns(val); }
        }
        applyFilter();
    }

    function genderTag(g, ref) {
        // TX- prefix always shows UNISEX tag regardless of stored gender value
        const refStr = String(ref || "").toUpperCase();
        if (refStr.startsWith("TX-")) {
            return `<span class="tag tag-unisex">UNISEX</span>`;
        }
        const cls = g === "WOMEN" ? "tag-women" : "tag-men";
        const label = g === "WOMEN" ? "WOMEN" : "MEN";
        return `<span class="tag ${cls}">${label}</span>`;
    }
    function fitTag(fit) {
        const map = {
            "SLIM":          ["#ede9fe","#6d28d9"],
            "REGULAR":       ["#ccfbf1","#0f766e"],
            "SEMI-OVER":     ["#fef3c7","#92400e"],
            "OVER":          ["#fee2e2","#991b1b"],
            "RELAX":         ["#fef3c7","#92400e"],
            "A-LINE":        ["#fce7f3","#be185d"],
            "FLARE":         ["#ede9fe","#6d28d9"],
            "LONG":          ["#dbeafe","#1d4ed8"],
            "CLASSIC PLEATS":["#ccfbf1","#0f766e"],
            "MICRO PLEATS":  ["#fef3c7","#92400e"],
            "WIDE PLEATS":   ["#fee2e2","#991b1b"],
            "5부":           ["#ede9fe","#6d28d9"],
            "9부":           ["#ccfbf1","#0f766e"],
        };
        if (!fit || !map[fit]) return "";
        return `<span class="tag" style="background:${map[fit][0]};color:${map[fit][1]}">${fit}</span>`;
    }

    function fabricTag(fabric) {
        if (!fabric) return "";
        if (fabric === 'JERSEY') return `<span class="tag tag-fabric-jersey">JERSEY</span>`;
        if (fabric === 'WOVEN')  return `<span class="tag tag-fabric-woven">WOVEN</span>`;
        return "";
    }

    function lineStyleTag(lineStyle) {
        if (!lineStyle) return "";
        return `<span class="tag" style="background:#f1f5f9;color:#475569;font-size:9px">${lineStyle}</span>`;
    }

    function renderCards(items) {
        const grid = document.getElementById("grid");
        document.getElementById("count").textContent = items.length;
        if (!items.length) {
            grid.innerHTML = `<div class="empty" style="grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text-muted);font-family:var(--sans);">
                <div style="font-size:32px;margin-bottom:12px;">🔍</div>
                <div style="font-size:14px;font-weight:500;margin-bottom:6px;color:var(--text-secondary);">결과가 없어요</div>
                <div style="font-size:12px;">필터 조건을 바꾸거나 RESET 해보세요</div>
            </div>`;
            return;
        }
        grid.innerHTML = items.map((item, i) => {
            const m = item.measures;
            const delay = Math.min(i * 40, 800);

            // TOP vs BOTTOM 구분 — 품번 prefix로 판단
            const refUpper = String(item.ref || "").toUpperCase();
            const isBottom = refUpper.startsWith("BM-") || refUpper.startsWith("BW-") ||
                ['SP','PT','SK','LG'].includes(item.line);
            let measuresHtml = '';
            if (isBottom) {
                if (item.line === 'SK') {
                    measuresHtml = `
                        <div class="measure-item">${m["Waist"]       ? "Waist: <span>"+m["Waist"]+"</span>" : ""}</div>
                        <div class="measure-item">${m["Outseam"]     ? "Outseam: <span>"+m["Outseam"]+"</span>" : ""}</div>
                        <div class="measure-item">${m["Pleats width"]? "Pleats W: <span>"+m["Pleats width"]+"</span>" : ""}</div>`;
                } else {
                    measuresHtml = `
                        <div class="measure-item">${m["Waist"]    ? "Waist: <span>"+m["Waist"]+"</span>" : ""}</div>
                        <div class="measure-item">${m["Low Hip"]  ? "Low Hip: <span>"+m["Low Hip"]+"</span>" : ""}</div>
                        <div class="measure-item">${m["Outseam"]  ? "Outseam: <span>"+m["Outseam"]+"</span>" : ""}</div>`;
                }
            } else {
                measuresHtml = `
                    <div class="measure-item">${m["Chest Circumference"] ? "Chest: <span>"+m["Chest Circumference"]+"</span>" : ""}</div>
                    <div class="measure-item">${m["Back Body Length"]    ? "CB Length: <span>"+m["Back Body Length"]+"</span>" : ""}</div>
                    <div class="measure-item">${m["Across Shoulder"]     ? "Shoulder: <span>"+m["Across Shoulder"]+"</span>" : ""}</div>
                    <div class="measure-item">${m["CB to SLV Length"]   ? "CB Sleeve: <span>"+m["CB to SLV Length"]+"</span>" : ""}</div>`;
            }

            return `<div class="card" style="animation-delay:${delay}ms" onclick="openModal('${item.uid || item.ref}')">
                <div class="card-img">
                    ${item.qc_in_progress ? `<span class="qc-badge" title="QC 진행중">진행중</span>` : ''}
                    <img src="${item.image_url || `images/${item.ref}.png`}" alt="${item.ref}"
                         data-fallback="${item.image_url ? `images/${item.ref}.png` : ''}"
                         onerror="if(this.dataset.fallback){this.src=this.dataset.fallback;this.dataset.fallback='';}else{this.onerror=null;this.parentNode.innerHTML='<div style=&quot;width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#ccc;font-size:12px;&quot;>이미지 없음</div>';}">
                </div>
                <div class="card-body">
                    <div class="card-ref">${item.uid || item.ref}</div>
                    <div class="tags">
                        ${genderTag(item.gender, item.ref)}
                        ${item.fabric ? fabricTag(item.fabric) : ''}
                        <span class="tag tag-line">${item.line}</span>
                        ${isBottom ? fitTag(item.subtype || item.fit) : fitTag(item.fit)}
                        ${isBottom && item.line_style ? lineStyleTag(item.line_style) : ''}
                    </div>
                    <div class="measures">${measuresHtml}</div>
                    ${(item.fabric_name || item.composition) ? `
                    <div style="height:0.5px;background:#E0DED8;margin:8px 0;"></div>
                    <div>
                        <div style="font-size:8px;letter-spacing:0.1em;text-transform:uppercase;color:#aaa;font-weight:600;margin-bottom:3px;font-family:var(--sans);">FABRIC</div>
                        ${item.fabric_name ? `<div style="font-size:9px;color:#555;font-weight:500;font-family:var(--sans);">${item.fabric_name}</div>` : ''}
                        ${item.composition ? `<div style="font-size:9px;color:#999;margin-top:1px;font-family:var(--sans);">${item.composition}</div>` : ''}
                    </div>` : ''}
                    ${item.remark ? `<div class="remark">${item.remark}</div>` : ""}
                </div>
            </div>`;
        }).join("");
    }

    function getSearchQuery() {
        const side = document.getElementById("search-input-side");
        return side ? side.value.toLowerCase().trim() : '';
    }

    function updateActiveFilterBar() {
        const bar = document.getElementById("active-filter-bar");
        const chips = document.getElementById("active-filter-chips");
        const filters = [];
        const q = getSearchQuery();

        if (currentTab === 'top') {
            const line   = document.getElementById("filter-line").value;
            const gender = document.getElementById("filter-gender").value;
            const fit    = document.getElementById("filter-fit").value;
            const fabric = document.getElementById("filter-top-fabric").value;
            if (gender) filters.push({label: gender, color: gender==='MEN'?'#1d4ed8': gender==='WOMEN'?'#be185d':'#0f766e'});
            if (line)   filters.push({label: line,   color: '#2D4A3E'});
            if (fabric) filters.push({label: fabric, color: fabric==='JERSEY'?'#0369a1':'#854d0e'});
            if (fit)    filters.push({label: fit,    color: '#0f766e'});
        } else {
            const {gender, line, fabric, fit} = bottomFilter;
            if (gender) filters.push({label: gender, color: gender==='MEN'?'#1d4ed8': gender==='WOMEN'?'#be185d':'#0f766e'});
            if (line)   filters.push({label: line,   color: '#2D4A3E'});
            if (fabric) filters.push({label: fabric, color: fabric==='JERSEY'?'#0369a1':'#b45309'});
            if (fit)    filters.push({label: fit,    color: '#0f766e'});
        }
        if (q) filters.push({label: `"${q}"`, color: '#6b7280'});

            ).join('');

    function applyFilter() {

        if (currentTab === 'top') {

            if (!line && !gender && !fit && !fabric && !q) {
                document.getElementById("grid").innerHTML = '';
                document.getElementById("count").textContent = '0';
                return;
            }
            renderCards(safeData.filter(item => {
                const isTX = String(item.ref || "").toUpperCase().startsWith("TX-");
                const genderMatch = !gender ||
                    (gender === 'MEN'    && (item.gender === 'MEN' || isTX)) ||
                    (gender === 'WOMEN'  && item.gender === 'WOMEN') ||
                    (gender === 'UNISEX' && item.gender === 'UNISEX');
                return genderMatch &&
                       (!line   || item.line    === line)   &&
                       (!fit    || item.fit     === fit)    &&
                       (!fabric || item.fabric  === fabric) &&
                       (!q      || (item.uid || item.ref).toLowerCase().includes(q));
            }));
            showBackBtn();
        } else {
            const { gender, line, fabric, fit } = bottomFilter;

            updateActiveFilterBar();

            if (!gender && !line && !fabric && !fit && !q) {
                document.getElementById("grid").innerHTML = '';
                document.getElementById("count").textContent = '0';
                return;
            }
            renderCards(safeDataBottom.filter(item => {
                const isTX = String(item.ref || "").toUpperCase().startsWith("TX-");
                const genderMatch = !gender ||
                    (gender === 'MEN'    && (item.gender === 'MEN' || isTX)) ||
                    (gender === 'WOMEN'  && item.gender === 'WOMEN') ||
                    (gender === 'UNISEX' && item.gender === 'UNISEX');
                const itemFit = item.line === 'SK' ? item.subtype :
                                item.line === 'LG' ? item.subtype : item.fit;
                return genderMatch &&
                       (!line   || item.line   === line)   &&
                       (!fabric || item.fabric === fabric) &&
                       (!fit    || itemFit     === fit)    &&
                       (!q      || (item.uid || item.ref).toLowerCase().includes(q));
            }));
            showBackBtn();
        }
    }

    function toggleHowToMeasure(btn) {
        const panel = document.getElementById("htm-panel");
        const specPanel = document.getElementById("size-guide-inner");
        const isOpen = panel.style.display !== "none";

        panel.style.display = isOpen ? "none" : "";
        btn.classList.toggle("active", !isOpen);

        if (!isOpen) {
            // 다른 패널 닫기
            specPanel.style.display = "none";
            document.getElementById("sg-spec-btn").classList.remove("active");
            // 카드/필터 초기화
            resetAll();
        }
    }

    function switchHtmTab(cat, btn) {
        document.querySelectorAll('.htm-tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('htm-img').src = `how-to-measure/htm-${cat}.png`;
    }

    function showBackBtn() {
        const btn = document.getElementById("back-btn");
        if (btn) btn.style.display = 'flex';
    }
    function hideBackBtn() {
        const btn = document.getElementById("back-btn");
        if (btn) btn.style.display = 'none';
    }
    function goBack() {
        // SPEC GUIDE 열려있으면 닫기
        const specPanel = document.getElementById("size-guide-inner");
        if (specPanel.style.display !== "none") {
            specPanel.style.display = "none";
            document.getElementById("sg-spec-btn").classList.remove("active");
            hideBackBtn();
            return;
        }
        // 필터 걸려있으면 초기화
        resetAll();
        hideBackBtn();
    }

    function toggleSpecGuide(btn) {
        const panel = document.getElementById("size-guide-inner");
        const isOpen = panel.style.display === "block";
        if (isOpen) {
            closeSpecGuide();
        } else {
            resetAll();
            panel.style.display = "block";
            btn.classList.add("active");
            if (currentTab === 'top') renderSizeGuide();
        }
    }

    function toggleSideFilter(type, val, btn) {
        const filterMap = { gender: 'filter-gender', line: 'filter-line', fit: 'filter-fit', fabric: 'filter-top-fabric' };
        const selectEl = document.getElementById(filterMap[type]);
        const btnClass = type === 'gender' ? '.sg-gender-btn' : type === 'fit' ? '.sg-fit-btn' : type === 'fabric' ? '.sg-top-fabric-btn' : '.sg-line-btn';

        closeSpecGuide();

        if (selectEl && selectEl.value === val) {
            selectEl.value = '';
            btn.classList.remove('active');
        } else {
            if (selectEl) selectEl.value = val;
            document.querySelectorAll(btnClass).forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
        applyFilter();
    }

    function resetAll() {
        document.getElementById("filter-line").value   = "";
        document.getElementById("filter-gender").value = "";
        document.getElementById("filter-fit").value    = "";
        const tf = document.getElementById("filter-top-fabric"); if(tf) tf.value = "";
        document.getElementById("search-input").value  = "";
        const sideSearch = document.getElementById("search-input-side");
        if (sideSearch) sideSearch.value = "";
        document.querySelectorAll('.sg-line-btn, .sg-gender-btn, .sg-fit-btn, .sg-top-fabric-btn')
            .forEach(b => b.classList.remove('active'));
        bottomFilter.gender = ''; bottomFilter.line = '';
        bottomFilter.fabric = ''; bottomFilter.fit  = '';
        document.querySelectorAll('.sg-b-gender-btn,.sg-b-line-btn,.sg-b-fabric-btn,.sg-b-fit-btn')
            .forEach(b => b.classList.remove('active'));
        // 카드 비우기
        document.getElementById("grid").innerHTML = '';
        document.getElementById("count").textContent = '0';
        document.getElementById("active-filter-bar").style.display = 'none';
        closeSpecGuide();
    }

    ["filter-line","filter-gender","filter-fit"].forEach(id =>
        document.getElementById(id).addEventListener("change", applyFilter)
    );
    document.getElementById("search-input").addEventListener("input", applyFilter);
    document.getElementById("search-input").addEventListener("keydown", e => {
        if (e.key === "Escape") resetAll();
    });

    // ── SIZE GUIDE ──
    const SG_DATA = {"men":[],"women":[]};
    const SG_DATA_BOTTOM = null;
    const safeSG = (SG_DATA && Array.isArray(SG_DATA.men)) ? SG_DATA : {men:[], women:[]};
    const safeSGBottom = (SG_DATA_BOTTOM && Array.isArray(SG_DATA_BOTTOM.men)) ? SG_DATA_BOTTOM : {men:[], women:[]};
    const FP_CLASS = {"REGULAR":"fp-regular","SEMI-OVER":"fp-semi-over","OVER":"fp-over","SLIM":"fp-slim","SPORTY":"fp-sporty"};

    function buildSgTable(group) {
        const lc = group.lineCode || group.line.split(' ')[0];
        const gc = group.gender || '';
        const fitCols = group.fits.map(f =>
            `<th><span class="fit-pill ${FP_CLASS[f.toUpperCase()]||'fp-regular'}" 
                onclick="filterFromSpecGuide('${lc}','${gc}','${f.toUpperCase()}')" 
                style="cursor:pointer;transition:opacity 0.15s;" 
                title="${lc} ${f} 카드 보기">${f}</span></th>`
        ).join("");
        const allowedPoms = ["Chest Circumference", "Back Body Length"];
        const poms = Object.keys(group.measures).filter(p => allowedPoms.includes(p));
        const bodyRows = poms.map(pom => {
            const cells = group.measures[pom].map(v => `<td>${v}</td>`).join("");
            return `<tr><td>${pom}</td>${cells}</tr>`;
        }).join("");
        return `<div class="sg-table-wrap"><table class="sg-table"><thead><tr><th>POM</th>${fitCols}</tr></thead><tbody>${bodyRows}</tbody></table></div>`;
    }

    let sgActiveLine = null;

    function renderSizeGuide() {
        const btnWrap = document.getElementById("sg-line-btns");
        const panelWrap = document.getElementById("sg-panels");
        const tabWrap = document.getElementById("sg-line-filter-tabs");
        if (!btnWrap || !panelWrap) return;

        const lineOrder = ["SL","RS","RL","MT","PQ","TR","WJ"];
        const lineMap = {};
        [...safeSG.men, ...safeSG.women].forEach(g => {
            const code = g.lineCode || g.line.split(' ')[0];
            if (!lineMap[code]) lineMap[code] = g.line;
        });
        const allLines = lineOrder.filter(c => lineMap[c]).map(c => ({code: c, label: lineMap[c]}));

        btnWrap.innerHTML = allLines.map((l) =>
            `<button class="sg-line-btn" data-val="${l.code}" onclick="toggleSideFilter('line','${l.code}',this)">${l.code}</button>`
        ).join("");

        // 라인 필터 탭
        if (tabWrap) {
            tabWrap.innerHTML = `<button class="htm-tab-btn active" onclick="filterSgLine(null,this)">ALL</button>` +
                allLines.map(l =>
                    `<button class="htm-tab-btn" onclick="filterSgLine('${l.code}',this)">${l.code}</button>`
                ).join("");
        }

        panelWrap.innerHTML = allLines.map((l) => {
            const menGroup = safeSG.men.find(g => (g.lineCode||g.line.split(/\s+/)[0]) === l.code);
            const womenGroup = safeSG.women.find(g => (g.lineCode||g.line.split(/\s+/)[0]) === l.code);
            if (menGroup) menGroup.gender = 'MEN';
            if (womenGroup) womenGroup.gender = 'WOMEN';
            const menHtml = menGroup ? buildSgTable(menGroup) : '<div style="color:#bbb;font-size:12px;padding:8px">데이터 없음</div>';
            const womenHtml = womenGroup ? buildSgTable(womenGroup) : '<div style="color:#bbb;font-size:12px;padding:8px">데이터 없음</div>';
            return `<div class="sg-content active" data-line="${l.code}">
                <div class="sg-line-section-title" onclick="filterFromSpecGuide('${l.code}','','')" style="cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px;" title="${l.code} 전체 카드 보기">${l.code}</div>
                <div class="sg-table-block">
                    <div class="sg-col-label">👔 Men — ${l.label}</div>
                    ${menHtml}
                </div>
                <div class="sg-table-block">
                    <div class="sg-col-label">👗 Women — ${l.label}</div>
                    ${womenHtml}
                </div>
                <div class="sg-section-divider"></div>
            </div>`;
        }).join("");
    }

    function filterSgLine(code, btn) {
        sgActiveLine = code;
        document.querySelectorAll('#sg-line-filter-tabs .htm-tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.sg-content').forEach(p => {
            p.style.display = (!code || p.dataset.line === code) ? '' : 'none';
        });
        // 카드도 즉시 반영
        if (code) {
            document.getElementById("filter-line").value = code;
            document.querySelectorAll('.sg-line-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.val === code);
            });
            applyFilter();
        } else {
            document.getElementById("filter-line").value = "";
            document.querySelectorAll('.sg-line-btn').forEach(b => b.classList.remove('active'));
            applyFilter();
        }
    }

    function selectSgLine(code, btn) {
        document.querySelectorAll(".sg-line-btn").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".sg-content").forEach(p => p.classList.remove("active"));
        btn.classList.add("active");
        const panel = document.querySelector(`.sg-content[data-line="${code}"]`);
        if (panel) panel.classList.add("active");
        // LINE 버튼 누르면 gender/fit 필터 초기화 → 남녀 전부 표시
        document.getElementById("filter-line").value = code;
        document.getElementById("filter-gender").value = "";
        document.getElementById("filter-fit").value = "";
        applyFilter();
    }

    function filterFromSpecGuide(lineCode, gender, fit) {
        // SPEC GUIDE 닫고 카드 필터 적용
        closeSpecGuide();

        // 필터 값 설정
        document.getElementById("filter-line").value   = lineCode || "";
        document.getElementById("filter-gender").value = gender   || "";
        document.getElementById("filter-fit").value    = fit      || "";

        // 사이드바 버튼 active 상태 반영
        document.querySelectorAll('.sg-line-btn').forEach(b => {
            b.classList.toggle('active', b.dataset.val === lineCode);
        });
        document.querySelectorAll('.sg-gender-btn').forEach(b => {
            b.classList.toggle('active', b.dataset.val === gender);
        });
        document.querySelectorAll('.sg-fit-btn').forEach(b => {
            b.classList.toggle('active', b.dataset.val === fit);
        });

        applyFilter();
        document.getElementById("results-area").scrollIntoView({behavior:"smooth"});
    }

    function filterByFit(fit, lineCode, gender) {
        filterFromSpecGuide(lineCode, gender, fit);
    }

    function toggleGuide() {
        const body = document.getElementById("sg-body");
        const btn = document.getElementById("sg-toggle-btn");
        const hidden = body.style.display === "none";
        body.style.display = hidden ? "" : "none";
        btn.textContent = hidden ? "접기 ▲" : "펼치기 ▼";
    }

    // Loading screen → fade out → render cards
    window.addEventListener("DOMContentLoaded", () => {
        const totalItems = safeData.length + safeDataBottom.length;
        const countEl = document.getElementById("loading-count");
        const fillEl  = document.getElementById("loading-progress-fill");
        let current = 0;
        const duration = 1000;
        const steps = 40;
        const increment = totalItems / steps;
        const interval = setInterval(() => {
            current = Math.min(current + increment, totalItems);
            if (countEl) countEl.textContent = Math.floor(current);
            if (fillEl) fillEl.style.width = Math.min(100, (current / totalItems) * 100) + '%';
            if (current >= totalItems) {
                clearInterval(interval);
                setTimeout(() => {
                    const ls = document.getElementById("loading-screen");
                    ls.classList.add("fade-out");
                    setTimeout(() => { ls.style.display = "none"; }, 600);
                    document.getElementById("count").textContent = '0';
                    // TOP/BOTTOM 탭 active 없이
                    document.getElementById("tab-top").classList.remove("active");
                    document.getElementById("tab-bottom").classList.remove("active");
                    // SPEC GUIDE 자동으로 열기
                    renderSizeGuide();
                    document.getElementById("size-guide-inner").style.display = "block";
                    document.getElementById("sg-spec-btn").classList.add("active");
                }, 300);
            }
        }, duration / steps);
    });

    const POM_CODE_MAP = {
        "Back Body Length":      "LG21",
        "Chest Circumference":   "CH10",
        "Waist":                 "WA10",
        "Sweep Straight":        "SW10",
        "Neck Width":            "NK10",
        "Front Neck Drop":       "NK30",
        "Across Shoulder":       "SH10",
        "CB to SLV Length":      "CS50",
        "Bicep":                 "SL20",
        "Elbow":                 "SL40",
        "Sleeve Opening":        "SL70",
        "AH Drop":               "AH10",
        "Armhole Depth":         "AH10",
        "Neck Trim Height":      "ET30",
        "CB Collar Height":      "CO11",
        "Hood Height":           "HD10",
        "Hood Width":            "HD20",
        "Upper Arm":             "SL20",
        "Low Hip":               "HP60",
        "Outseam":               "LG80",
        "Inseam":                "LG70",
        "Front Rise":            "RS10",
        "Front Rise (오비 제외)": "RS10",
        "Back Rise":             "RS20",
        "Back Rise (오비 제외)":  "RS20",
        "Waist band":            "WA60",
        "Thigh":                 "LE10",
        "Knee":                  "LE31",
        "Leg Opening":           "LEB0",
        "Skirt Sweep":           "SKB0",
        "Front Skirt Length":    "SK10",
        "Back Skirt Length":     "SK60",
        "Pleats width":          "—"
    };

    function openModal(uid) {
        const item = safeData.find(d => (d.uid || d.ref) === uid)
                  || safeDataBottom.find(d => (d.uid || d.ref) === uid);
        if (!item) return;
        document.getElementById("modal-ref").textContent = item.uid || item.ref;
        // 사진 2장 가로 배치 (Snowflake 컬러 URL 2개 또는 1개. 없으면 로컬 fallback)
        const localFallback = `images/${item.ref}.png`;
        const allUrls = (item.image_urls && item.image_urls.length)
            ? item.image_urls
            : (item.image_url ? [item.image_url] : [localFallback]);
        const showUrls = allUrls.slice(0, 2);
        const colors = item.image_colors || [];

        const qcBadgeHtml = item.qc_in_progress ? `<span class="qc-badge" title="QC 진행중">진행중</span>` : '';
        const imgHtml = (url, i) => `
            <div class="modal-img">${i === 0 ? qcBadgeHtml : ''}<img src="${url}" alt="${colors[i] || item.ref}"
                data-fallback="${url !== localFallback ? localFallback : ''}"
                onerror="if(this.dataset.fallback){this.src=this.dataset.fallback;this.dataset.fallback='';}else{this.onerror=null;this.parentNode.innerHTML='<div style=&quot;width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#ccc;&quot;>이미지 없음</div>';}"></div>`;

        document.getElementById("modal-img-wrap").innerHTML = showUrls.length > 1
            ? `<div class="modal-img-pair">${showUrls.map(imgHtml).join("")}</div>`
            : imgHtml(showUrls[0], 0);

        // 모달 가로폭 동적 확장: 사진 2장이면 wide 클래스
        document.querySelector(".modal").classList.toggle("modal-wide", showUrls.length > 1);
        document.getElementById("modal-remark").textContent = item.remark || "";

        // 태그 순서: 성별 → FABRIC → LINE → FIT → LINE_STYLE
        const isBottomItem = ['SP','PT','SK','LG'].includes(item.line);
        const fabricTagHtml = item.fabric ? fabricTag(item.fabric) : '';
        const fitTagHtml = isBottomItem ? fitTag(item.subtype || item.fit) : fitTag(item.fit);
        const lineStyleHtml = item.line_style ? lineStyleTag(item.line_style) : '';
        const qcTagHtml = item.qc_in_progress ? `<span class="tag tag-qc">QC 진행중</span>` : '';
        document.getElementById("modal-tags").innerHTML =
            genderTag(item.gender, item.ref) +
            fabricTagHtml +
            `<span class="tag tag-line">${item.line}</span>` +
            fitTagHtml +
            lineStyleHtml +
            qcTagHtml;

        // COMPOSITION + FABRIC NAME 표시
        const compEl = document.getElementById("modal-composition");
        if (compEl) {
            if (item.fabric_name || item.composition) {
                compEl.style.display = '';
                compEl.querySelector('.fabric-name-val').textContent = item.fabric_name || '';
                compEl.querySelector('.comp-value').textContent = item.composition || '';
                compEl.querySelector('.fabric-name-val').style.display = item.fabric_name ? '' : 'none';
                compEl.querySelector('.comp-value').parentElement.style.display = item.composition ? '' : 'none';
            } else {
                compEl.style.display = 'none';
            }
        }

        const boldPoms = ["Back Body Length", "Chest Circumference", "Across Shoulder",
                          "Low Hip", "Outseam"];
        const isBottomModal = ['SP','PT','SK','LG'].includes(item.line);
        document.getElementById("modal-table").innerHTML =
            Object.entries(item.measures)
                  .map(([k,v]) => {
                      const isHighlight = boldPoms.includes(k) || (k === "Waist" && isBottomModal);
                      const style   = isHighlight ? ' style="background:#F0F7F4;"' : '';
                      const tdStyle = isHighlight ? ' style="color:#2D4A3E;font-weight:500"' : '';
                      const pomCode = k === "Waist" ? (isBottomModal ? "WA20" : "WA10") : POM_CODE_MAP[k];
                      const pom = pomCode ? `<span style="font-size:9px;color:#2D4A3E;font-weight:700;margin-right:5px;letter-spacing:0.04em;">${pomCode}</span>` : '';
                      return `<tr${style}><td${tdStyle}>${pom}${k}</td><td${tdStyle}>${v}</td></tr>`;
                  })
                  .join("");
        document.getElementById("modal-overlay").classList.add("open");
    }

    function closeModal() {
        document.getElementById("modal-overlay").classList.remove("open");
    }
    document.getElementById("modal-overlay").addEventListener("click", e => {
        if (e.target === document.getElementById("modal-overlay")) closeModal();
    });
    document.addEventListener("keydown", e => {
        if (e.key === "Escape") closeModal();
    });
</script>
</body>
</html>
