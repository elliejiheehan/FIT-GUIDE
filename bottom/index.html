<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sergio Tacchini — Bottom Fit Guide</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --white: #ffffff;
            --off-white: #fafafa;
            --bg: #ffffff;
            --border: #e8e8e8;
            --text-primary: #111111;
            --text-secondary: #555555;
            --text-muted: #999999;
            --accent: #111111;
            --tag-line-bg: #111111;
            --tag-line-color: #ffffff;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.07);
            --shadow-md: 0 4px 20px rgba(0,0,0,0.10);
            --radius: 10px;
        }

        body {
            font-family: "Noto Sans KR", "Noto Sans", sans-serif;
            background: var(--bg);
            color: var(--text-primary);
        }

        /* ── HEADER ── */
        header {
            background: #fff;
            border-bottom: 1.5px solid var(--border);
            padding: 22px 40px;
            display: flex;
            align-items: baseline;
            gap: 14px;
        }
        .header-brand {
            font-family: "Noto Sans", sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--text-muted);
        }
        .header-title {
            font-family: "Noto Sans", sans-serif;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--text-primary);
        }
        .header-title .emoji {
            font-size: 18px;
            margin-right: 6px;
        }
        .header-meta {
            margin-left: auto;
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 0.3px;
        }

        /* ── LOADING SCREEN ── */
        #loading-screen {
            position: fixed; inset: 0;
            background: #fff;
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            transition: opacity 0.5s ease;
        }
        #loading-screen.fade-out { opacity: 0; pointer-events: none; }
        .loading-brand {
            font-family: "Noto Sans", sans-serif;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-muted);
        }
        .loading-title {
            font-family: "Noto Sans", sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
        }
        .loading-bar-wrap {
            width: 160px;
            height: 2px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
        }
        .loading-bar {
            height: 100%;
            width: 0%;
            background: var(--text-primary);
            border-radius: 2px;
            animation: loadBar 0.9s ease forwards;
        }
        @keyframes loadBar {
            0%   { width: 0%; }
            60%  { width: 75%; }
            100% { width: 100%; }
        }

        /* ── CATEGORY TABS ── */
        .cat-tabs-bar {
            background: #fff;
            border-bottom: 1.5px solid var(--border);
            padding: 0 40px;
            display: flex;
            align-items: flex-end;
            gap: 2px;
        }
        .cat-tab {
            padding: 14px 24px 12px;
            font-family: "Noto Sans", sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-muted);
            cursor: pointer;
            border: none;
            border-bottom: 2.5px solid transparent;
            background: none;
            transition: color 0.18s, border-color 0.18s;
        }
        .cat-tab:hover { color: var(--text-primary); }
        .cat-tab.active { color: var(--text-primary); border-bottom-color: #111; }

        /* ── SP 기장 가이드 패널 ── */
        .info-panel {
            display: none;
            background: #fff;
            border-bottom: 1px solid var(--border);
            padding: 24px 40px;
        }
        .info-panel.open { display: block; }
        .info-panel-title {
            font-family: "Noto Sans", sans-serif;
            font-size: 11px; font-weight: 700;
            letter-spacing: 1.5px; text-transform: uppercase;
            color: var(--text-muted); margin-bottom: 16px;
        }
        .sp-guide-wrap { display: flex; gap: 32px; flex-wrap: wrap; }
        .sp-guide-block { }
        .sp-guide-gender {
            font-size: 11px; font-weight: 700; letter-spacing: 1px;
            color: var(--text-secondary); margin-bottom: 8px;
            text-transform: uppercase;
        }
        .sp-guide-table { border-collapse: collapse; font-size: 12px; }
        .sp-guide-table thead th {
            background: #111; color: #fff;
            padding: 7px 20px; text-align: center;
            font-family: "Noto Sans", sans-serif;
            font-size: 10px; font-weight: 600; letter-spacing: 1px;
        }
        .sp-guide-table thead th:first-child { text-align: left; border-radius: 6px 0 0 0; }
        .sp-guide-table thead th:last-child  { border-radius: 0 6px 0 0; }
        .sp-guide-table tbody td {
            padding: 8px 20px; text-align: center;
            border-bottom: 1px solid var(--border);
            color: var(--text-primary); font-size: 12px;
        }
        .sp-guide-table tbody td:first-child {
            text-align: left; font-weight: 700;
            color: var(--text-secondary); white-space: nowrap;
        }
        .sp-guide-table tbody tr:last-child td { border-bottom: none; }
        .sp-guide-table tbody tr:hover td { background: var(--off-white); }
        .sp-guide-note {
            font-size: 10px; color: var(--text-muted);
            margin-top: 14px; line-height: 1.7;
        }

        /* ── SUB FILTERS ── */
        .sub-filters-bar {
            background: #fff;
            border-bottom: 1px solid var(--border);
            padding: 10px 40px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .gender-toggle {
            display: flex;
            border: 1.5px solid var(--border);
            border-radius: 100px;
            overflow: hidden;
        }
        .gender-btn {
            padding: 7px 16px;
            font-family: "Noto Sans", sans-serif;
            font-size: 10px; font-weight: 700;
            letter-spacing: 1px; text-transform: uppercase;
            border: none; background: #fff;
            color: var(--text-muted); cursor: pointer;
            transition: all 0.18s;
        }
        .gender-btn.active { background: #111; color: #fff; }
        .filter-pill {
            display: flex; align-items: center; gap: 7px;
            border: 1.5px solid var(--border);
            border-radius: 100px;
            padding: 7px 16px; background: #fff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .filter-pill:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0,0,0,0.06);
        }
        .filter-pill label {
            font-family: "Noto Sans", sans-serif;
            font-size: 10px; font-weight: 700;
            letter-spacing: 1.5px; text-transform: uppercase;
            color: var(--text-muted); white-space: nowrap;
        }
        .filter-pill select, .filter-pill input {
            border: none; background: transparent;
            font-family: "Noto Sans KR", "Noto Sans", sans-serif;
            font-size: 12px; font-weight: 500;
            color: var(--text-primary);
            outline: none; cursor: pointer; min-width: 80px;
        }
        .filter-pill input { min-width: 130px; }
        .filter-pill input::placeholder { color: var(--text-muted); }
        .btn-reset {
            background: none; border: 1.5px solid var(--border);
            border-radius: 100px; padding: 8px 18px;
            font-family: "Noto Sans", sans-serif;
            font-size: 10px; font-weight: 600; letter-spacing: 1px;
            color: var(--text-muted); cursor: pointer;
            transition: border-color 0.2s, color 0.2s;
        }
        .btn-reset:hover { border-color: #aaa; color: #555; }

        /* ── RESULTS AREA ── */
        /* ── RESULTS AREA ── */
        .results-area { padding: 0 40px 48px; }

        .count-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 24px 0 16px;
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 0.3px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }
        .count-bar strong { color: var(--text-primary); font-size: 14px; font-weight: 700; }

        /* ── GRID ── */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 18px;
        }

        /* card entrance animation */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .card {
            background: #fff;
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            transition: box-shadow 0.22s, border-color 0.22s, transform 0.22s;
            animation: fadeUp 0.38s ease both;
        }
        .card:hover {
            box-shadow: var(--shadow-md);
            border-color: #bbb;
            transform: translateY(-3px);
        }
        .card-img {
            width: 100%;
            height: 300px;
            background: var(--off-white);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-bottom: 1px solid var(--border);
        }
        .card-img img {
            width: 100%; height: 100%;
            object-fit: contain;
            object-position: center top;
            display: block;
        }
        .card-body { padding: 14px 16px 16px; }
        .card-ref {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.6px;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        .tags { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
        .tag {
            font-size: 9px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 100px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        .tag-line  { background: var(--tag-line-bg); color: var(--tag-line-color); }
        .tag-men   { background: #e0f2fe; color: #0369a1; }
        .tag-women { background: #fce7f3; color: #be185d; }
        .tag-unisex{ background: #ede9fe; color: #6d28d9; }

        .measures { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 10px; }
        .measure-item { font-size: 11px; color: var(--text-secondary); }
        .measure-item span { font-weight: 600; color: var(--text-primary); }
        .remark {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 9px;
            border-top: 1px solid var(--border);
            padding-top: 8px;
            line-height: 1.5;
        }


        /* ── MODAL ── */
        .modal-overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.35);
            backdrop-filter: blur(4px);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: #fff;
            border-radius: 16px;
            max-width: 720px;
            width: 95%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 36px;
            position: relative;
            animation: fadeUp 0.28s ease;
        }
        .modal-close {
            position: absolute; top: 18px; right: 22px;
            font-size: 22px; cursor: pointer;
            color: var(--text-muted);
            background: none; border: none;
            transition: color 0.15s;
        }
        .modal-close:hover { color: var(--text-primary); }
        .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
        .modal-img {
            width: 100%;
            border-radius: 10px;
            background: var(--off-white);
            display: flex; align-items: center; justify-content: center;
            color: var(--text-muted); font-size: 13px;
            min-height: 300px; overflow: hidden;
            border: 1px solid var(--border);
        }
        .modal-img img { width: 100%; object-fit: contain; object-position: center top; max-height: 420px; display: block; border-radius: 10px; }
        .modal-info h2 { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
        .modal-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        .modal-table tr td { padding: 6px 8px; font-size: 12px; border-bottom: 1px solid var(--border); }
        .modal-table tr td:first-child { color: var(--text-muted); width: 55%; }
        .modal-table tr td:last-child { font-weight: 600; color: var(--text-primary); }

        /* ── EMPTY STATE ── */
        .empty {
            grid-column: 1/-1;
            padding: 60px 0;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
        }

        @media(max-width: 640px) {
            header { padding: 18px 20px; }
            .cat-tabs-bar { padding: 0 16px; }
            .cat-tab { padding: 12px 14px 10px; font-size: 10px; }
            .info-panel { padding: 16px; }
            .sp-guide-wrap { flex-direction: column; gap: 20px; }
            .sub-filters-bar { padding: 10px 16px; }
            .results-area { padding: 0 16px 40px; }
            .grid { grid-template-columns: 1fr 1fr; gap: 12px; }
            .card-img { height: 220px; }
            .modal-grid { grid-template-columns: 1fr; }
            .modal { padding: 24px 20px; }
        }
    </style>
</head>
<body>

<!-- LOADING SCREEN -->
<div id="loading-screen">
    <div class="loading-brand">Sergio Tacchini</div>
    <div class="loading-title">👖 Bottom Fit Guide</div>
    <div class="loading-bar-wrap"><div class="loading-bar"></div></div>
</div>

    <button class="cat-tab" onclick="switchTab('PT', this)">PT</button>

<!-- SP 기장 가이드 패널 (SP 탭 선택 시만 표시) -->
<div class="info-panel" id="info-panel"></div>

<!-- SUB FILTERS -->
<div class="sub-filters-bar">

    </div>
    <div class="filter-pill" id="pill-fit" style="display:none">
        <label>Fit</label>

        </select>
    </div>
    <div class="filter-pill" id="pill-line-style" style="display:none">
        <label>Line</label>
        <select id="filter-line-style" onchange="applyFilter()">
            <option value="">All</option>
        </select>
    </div>
    <div class="filter-pill">
        <label>REF</label>
        <input type="text" id="search-input" placeholder="검색...">
    </div>
    <button class="btn-reset" onclick="resetAll()">↺ RESET</button>
</div>

<!-- RESULTS -->
<div class="results-area" id="results-area">
    <div class="count-bar"><strong id="count">0</strong>&nbsp;items</div>
    <div class="grid" id="grid"></div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay">
    <div class="modal">
        <button class="modal-close" onclick="closeModal()">&times;</button>
        <div class="modal-grid">
            <div id="modal-img-wrap"></div>
            <div class="modal-info">
                <div class="tags" id="modal-tags"></div>
                <h2 id="modal-ref"></h2>
                <div id="modal-remark" style="font-size:12px;color:#999;margin-bottom:10px;"></div>
                <table class="modal-table" id="modal-table"></table>
            </div>
        </div>
    </div>
</div>

    function genderTag(g, ref) {
        // TX- prefix always shows UNISEX tag regardless of stored gender value
        const refStr = String(ref || "").toUpperCase();
        if (refStr.startsWith("TX-")) {
            return `<span class="tag tag-unisex">UNISEX</span>`;
        }
        const cls = g === "WOMEN" ? "tag-women" : "tag-men";
        const label = g === "WOMEN" ? "WOMEN" : "MEN";
        return `<span class="tag ${cls}">${label}</span>`;
    }
    function fitTag(fit) {
        const map = {
            "SLIM":         ["#ede9fe","#6d28d9"],
            "REGULAR":      ["#ccfbf1","#0f766e"],
            "RELAX":        ["#fef3c7","#92400e"],
            "RELAX - WIDE": ["#fef9c3","#713f12"],
            "COMFORT":      ["#d1fae5","#065f46"],
            "WIDE":         ["#fee2e2","#991b1b"],
            "JOGGER":       ["#e0f2fe","#0369a1"],
            "SLIM-BOOTSCUT":["#ffedd5","#9a3412"]
        };
        if (!map[fit]) return "";
        return `<span class="tag" style="background:${map[fit][0]};color:${map[fit][1]}">${fit}</span>`;
    }

    function fabricTag(fabric) {
        const map = {
            "JERSEY": ["#ede9fe","#5b21b6"],
            "WOVEN":  ["#fef9c3","#854d0e"]
        };
        if (!map[fabric]) return "";
        return `<span class="tag" style="background:${map[fabric][0]};color:${map[fabric][1]};font-size:10px;">${fabric}</span>`;
    }
    function lineStyleTag(ls) {
        const map = {
            "STRAIGHT":  ["#f0fdf4","#166534"],
            "TAPERED":   ["#fdf4ff","#7e22ce"],
            "WIDE":      ["#fff7ed","#9a3412"],
            "JOGGER":    ["#f0f9ff","#0c4a6e"],
            "BOOT CUT":  ["#fdf2f8","#9d174d"]
        };
        const c = map[ls] || ["#f3f4f6","#6b7280"];
        return `<span class="tag" style="background:${c[0]};color:${c[1]};font-size:10px;">${ls}</span>`;
    }
    function subtypeTag(sub) {
        return `<span class="tag" style="background:#f3f4f6;color:#6b7280;font-size:10px;">${sub}</span>`;
    }

    function renderCards(items) {
        const grid = document.getElementById("grid");
        document.getElementById("count").textContent = items.length;
        if (!items.length) {
            grid.innerHTML = '<div class="empty">검색 결과가 없습니다.</div>';
            return;
        }
        grid.innerHTML = items.map((item, i) => {
            const m = item.measures;
            const delay = Math.min(i * 40, 800);
            return `<div class="card" style="animation-delay:${delay}ms" onclick="openModal('${item.uid || item.ref}')">
                <div class="card-img">
                    <img src="images/${item.ref}.png" alt="${item.ref}"
                         onerror="this.onerror=null;this.parentNode.innerHTML='<div style=&quot;width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#ccc;font-size:12px;&quot;>이미지 없음</div>'">
                </div>
                <div class="card-body">
                    <div class="card-ref">${item.uid || item.ref}</div>
                    <div class="tags">
                        ${genderTag(item.gender, item.ref)}
                        ${item.fabric ? fabricTag(item.fabric) : ""}
                        <span class="tag tag-line">${item.line}</span>
                        ${fitTag(item.fit)}
                        ${item.line_style ? lineStyleTag(item.line_style) : ""}
                        ${item.subtype ? subtypeTag(item.subtype) : ""}
                    </div>
                    <div class="measures">
                        <div class="measure-item">${m["Waist"] ? "Waist: <span>"+m["Waist"]+"</span>" : ""}</div>
                        <div class="measure-item">${m["Low Hip"] ? "Hip: <span>"+m["Low Hip"]+"</span>" : ""}</div>
                        <div class="measure-item">${m["Outseam"] ? "Outseam: <span>"+m["Outseam"]+"</span>" : ""}</div>

                    </div>
                    ${item.remark ? `<div class="remark">${item.remark}</div>` : ""}
                </div>
            </div>`;
        }).join("");
    }

    const SP_GUIDE = {
        men: [
            { inch: '3" (3부)',   outseam: '36cm (35~37)', inseam: '8cm (7~9)'   },
            { inch: '5" (3.5~4부)', outseam: '41cm (40~42)', inseam: '13cm (12~14)' },
            { inch: '7" (4.5부)', outseam: '46cm (45~47)', inseam: '18cm (17~19)' },
            { inch: '9" (5부)',   outseam: '51cm (50~52)', inseam: '23cm (22~24)' },
            { inch: '7부 (Extra)', outseam: '67cm', inseam: '39cm' }
        ],
        women: [
            { inch: '3" (3부)',   outseam: '34cm (33~35)', inseam: '8cm (7~9)'   },
            { inch: '5" (3.5~4부)', outseam: '39cm (38~40)', inseam: '13cm (12~14)' },
            { inch: '7" (4.5부)', outseam: '44cm (43~45)', inseam: '18cm (17~19)' },
            { inch: '9" (5부)',   outseam: '49cm (48~50)', inseam: '23cm (22~24)' },
            { inch: '7부 (Extra)', outseam: '62cm', inseam: '36cm' }
        ]
    };

    function renderInfoPanel() {
        const panel = document.getElementById("info-panel");
        if (currentTab !== "SP") {
            panel.classList.remove("open");
            return;
        }
        panel.classList.add("open");
        const makeTable = (genderLabel, rows) => `
            <div class="sp-guide-block">
                <div class="sp-guide-gender">${genderLabel}</div>
                <table class="sp-guide-table">
                    <thead><tr><th>기장</th><th>Outseam</th><th>Inseam</th></tr></thead>
                    <tbody>${rows.map(r => `
                        <tr>
                            <td>${r.inch}</td>
                            <td>${r.outseam}</td>
                            <td>${r.inseam}</td>
                        </tr>`).join("")}
                    </tbody>
                </table>
            </div>`;
        panel.innerHTML = `
            <div class="info-panel-title">반바지 기장 가이드 — Outseam / Inseam</div>
            <div class="sp-guide-wrap">
                ${makeTable("MEN · Dummy Waist 78cm", SP_GUIDE.men)}
                ${makeTable("WOMEN · Dummy Waist 65cm", SP_GUIDE.women)}
            </div>
            <div class="sp-guide-note">
                * Outseam 기장은 남 78cm / 여 65cm 허리 둘레일 때 착장 위치 기준 &nbsp;·&nbsp; * Inseam 기장은 밑위 발란스에 따라 변동 가능
            </div>`;
    }

    function updateSubFilters() {
        const fitPill  = document.getElementById("pill-fit");
        const linePill = document.getElementById("pill-line-style");
        const fitSel   = document.getElementById("filter-fit");
        const lineSel  = document.getElementById("filter-line-style");

        // Fit 필터: SK일 때 subtype 기준, 나머지는 fit 기준
        const showFit = currentTab !== "ALL";
        fitPill.style.display = showFit ? "" : "none";
        if (showFit) {
            const filtered = currentTab ? safeData.filter(i => i.line === currentTab) : safeData;
            const SK_ORDER = ["A-LINE", "FLARE", "LONG", "CLASSIC PLEATS", "MICRO PLEATS", "WIDE PLEATS"];
            const rawValues = [...new Set(
                filtered.map(i => (currentTab === "SK" || currentTab === "LG") ? i.subtype : i.fit).filter(Boolean)
            )];
            const values = currentTab === "SK"
                ? SK_ORDER.filter(v => rawValues.includes(v))
                : rawValues.sort();
            const cur = fitSel.value;
            fitSel.innerHTML = `<option value="">All</option>` +
                values.map(v => `<option value="${v}">${v}</option>`).join("");
            fitSel.value = values.includes(cur) ? cur : "";
        }

        // Line Style: PT일 때만
        const showLine = currentTab === "PT";
        linePill.style.display = showLine ? "" : "none";
        if (showLine) {
            const filtered = safeData.filter(i => i.line === "PT");
            const values = [...new Set(filtered.map(i => i.line_style).filter(Boolean))].sort();
            const cur = lineSel.value;
            lineSel.innerHTML = `<option value="">All</option>` +
                values.map(v => `<option value="${v}">${v}</option>`).join("");
            lineSel.value = values.includes(cur) ? cur : "";
        } else {
            lineSel.value = "";
        }
    }

    function applyFilter() {
        const fit        = document.getElementById("filter-fit").value;
        const fabric     = document.getElementById("filter-fabric").value;
        const line_style = document.getElementById("filter-line-style").value;
        const q          = document.getElementById("search-input").value.toLowerCase().trim();

        renderCards(safeData.filter(item => {
            const ref = String(item.ref || "").toUpperCase();
            const isTX = ref.startsWith("TX-");
            const effectiveGender = isTX ? "MEN" : item.gender;
            const genderMatch = !currentGender || effectiveGender === currentGender;
            const lineMatch   = !currentTab || currentTab === "ALL" || item.line === currentTab;
            const fitMatch    = !fit || ((item.line === "SK" || item.line === "LG") ? item.subtype === fit : item.fit === fit);
            return genderMatch && lineMatch && fitMatch &&
                (!fabric     || item.fabric     === fabric)     &&
                (!line_style || item.line_style === line_style) &&
                (!q          || (item.uid || item.ref).toLowerCase().includes(q));
        }));
    }

    function switchTab(tab, btn) {
        currentTab = tab;
        document.querySelectorAll(".cat-tab").forEach(t => t.classList.remove("active"));
        btn.classList.add("active");
        // fit/line-style 필터 초기화
        document.getElementById("filter-fit").value = "";
        document.getElementById("filter-line-style").value = "";
        updateSubFilters();
        renderInfoPanel();
        applyFilter();
    }

    function setGender(gender, btn) {
        currentGender = gender;
        document.querySelectorAll(".gender-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        applyFilter();
    }

    function resetAll() {
        currentTab    = "ALL";
        currentGender = "";
        document.querySelectorAll(".cat-tab").forEach((t, i) => t.classList.toggle("active", i === 0));
        document.querySelectorAll(".gender-btn").forEach((b, i) => b.classList.toggle("active", i === 0));
        document.getElementById("filter-fabric").value    = "";
        document.getElementById("filter-fit").value      = "";
        document.getElementById("filter-line-style").value = "";
        document.getElementById("search-input").value    = "";
        updateSubFilters();
        renderInfoPanel();
        applyFilter();
    }

    document.getElementById("search-input").addEventListener("input", applyFilter);
    document.getElementById("search-input").addEventListener("keydown", e => {
        if (e.key === "Escape") resetAll();
    });

    // Loading screen → fade out → render cards
    // Loading screen → fade out → render cards
    window.addEventListener("DOMContentLoaded", () => {
        setTimeout(() => {
            const ls = document.getElementById("loading-screen");
            ls.classList.add("fade-out");
            setTimeout(() => { ls.style.display = "none"; }, 500);
            updateSubFilters();
            renderInfoPanel();
            renderCards(safeData);
        }, 1100);
    });

    function openModal(uid) {
        const item = safeData.find(d => (d.uid || d.ref) === uid);
        if (!item) return;
        document.getElementById("modal-ref").textContent = item.uid || item.ref;
        document.getElementById("modal-img-wrap").innerHTML =
            `<div class="modal-img"><img src="images/${item.ref}.png" alt="${item.ref}"
                onerror="this.onerror=null;this.parentNode.innerHTML='<div style=&quot;width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#ccc;&quot;>이미지 없음</div>'"></div>`;
        document.getElementById("modal-remark").textContent = item.remark || "";
        document.getElementById("modal-tags").innerHTML =
            genderTag(item.gender, item.ref) +
            (item.fabric ? fabricTag(item.fabric) : "") +
            `<span class="tag tag-line">${item.line}</span>` +
            fitTag(item.fit) +
            (item.line_style ? lineStyleTag(item.line_style) : "") +
            (item.subtype ? subtypeTag(item.subtype) : "");
        document.getElementById("modal-table").innerHTML =
            Object.entries(item.measures)
                  .map(([k,v]) => `<tr><td>${k}</td><td>${v}</td></tr>`)
                  .join("");
        document.getElementById("modal-overlay").classList.add("open");
    }

    function closeModal() {
        document.getElementById("modal-overlay").classList.remove("open");
    }
    document.getElementById("modal-overlay").addEventListener("click", e => {
        if (e.target === document.getElementById("modal-overlay")) closeModal();
    });
    document.addEventListener("keydown", e => {
        if (e.key === "Escape") closeModal();
    });

</script>
</body>
</html>
