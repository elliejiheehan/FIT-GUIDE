<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sergio Tacchini — Top Fit Guide</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --white: #ffffff;
            --off-white: #fafafa;
            --bg: #ffffff;
            --border: #e8e8e8;
            --text-primary: #111111;
            --text-secondary: #555555;
            --text-muted: #999999;
            --accent: #111111;
            --tag-line-bg: #111111;
            --tag-line-color: #ffffff;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.07);
            --shadow-md: 0 4px 20px rgba(0,0,0,0.10);
            --radius: 10px;
        }

        body {
            font-family: "Noto Sans KR", "Noto Sans", sans-serif;
            background: var(--bg);
            color: var(--text-primary);
        }

        /* ── HEADER ── */
        header {
            background: #fff;
            border-bottom: 1.5px solid var(--border);
            padding: 22px 40px;
            display: flex;
            align-items: baseline;
            gap: 14px;
        }
        .header-brand {
            font-family: "Noto Sans", sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--text-muted);
        }
        .header-title {
            font-family: "Noto Sans", sans-serif;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--text-primary);
        }
        .header-title .emoji {
            font-size: 18px;
            margin-right: 6px;
        }
        .header-meta {
            margin-left: auto;
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 0.3px;
        }

        /* ── LOADING SCREEN ── */
        #loading-screen {
            position: fixed; inset: 0;
            background: #fff;
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            transition: opacity 0.5s ease;
        }
        #loading-screen.fade-out { opacity: 0; pointer-events: none; }
        .loading-brand {
            font-family: "Noto Sans", sans-serif;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-muted);
        }
        .loading-title {
            font-family: "Noto Sans", sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
        }
        .loading-bar-wrap {
            width: 160px;
            height: 2px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
        }
        .loading-bar {
            height: 100%;
            width: 0%;
            background: var(--text-primary);
            border-radius: 2px;
            animation: loadBar 0.9s ease forwards;
        }
        @keyframes loadBar {
            0%   { width: 0%; }
            60%  { width: 75%; }
            100% { width: 100%; }
        }

        /* ── FILTERS BAR (always visible after load) ── */

        /* ── FILTERS BAR ── */
        .filters-bar {
            background: #fff;
            border-bottom: 1px solid var(--border);
            padding: 14px 40px;
        }
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }
        .filter-pill {
            display: flex;
            align-items: center;
            gap: 7px;
            border: 1.5px solid var(--border);
            border-radius: 100px;
            padding: 8px 18px;
            background: #fff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .filter-pill:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0,0,0,0.06);
        }
        .filter-pill label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-muted);
            white-space: nowrap;
        }
        .filter-pill select,
        .filter-pill input {
            border: none;
            background: transparent;
            font-family: "Noto Sans KR", "Noto Sans", sans-serif;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            outline: none;
            cursor: pointer;
            min-width: 80px;
        }
        .filter-pill input { min-width: 140px; }
        .filter-pill input::placeholder { color: var(--text-muted); }

        .btn-reset {
            background: none;
            border: 1.5px solid var(--border);
            border-radius: 100px;
            padding: 9px 20px;
            font-family: "Noto Sans", sans-serif;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--text-muted);
            cursor: pointer;
            transition: border-color 0.2s, color 0.2s;
        }
        .btn-reset:hover { border-color: #aaa; color: #555; }

        /* ── RESULTS AREA ── */
        .results-area { padding: 0 40px 48px; }

        .count-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 24px 0 16px;
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 0.3px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }
        .count-bar strong { color: var(--text-primary); font-size: 14px; font-weight: 700; }

        /* ── GRID ── */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 18px;
        }

        /* card entrance animation */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .card {
            background: #fff;
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            transition: box-shadow 0.22s, border-color 0.22s, transform 0.22s;
            animation: fadeUp 0.38s ease both;
        }
        .card:hover {
            box-shadow: var(--shadow-md);
            border-color: #bbb;
            transform: translateY(-3px);
        }
        .card-img {
            width: 100%;
            height: 300px;
            background: var(--off-white);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-bottom: 1px solid var(--border);
        }
        .card-img img {
            width: 100%; height: 100%;
            object-fit: contain;
            object-position: center top;
            display: block;
        }
        .card-body { padding: 14px 16px 16px; }
        .card-ref {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.6px;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        .tags { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
        .tag {
            font-size: 9px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 100px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        .tag-line  { background: var(--tag-line-bg); color: var(--tag-line-color); }
        .tag-men   { background: #dbeafe; color: #1d4ed8; }
        .tag-women { background: #fce7f3; color: #be185d; }
        .tag-unisex{ background: #ede9fe; color: #6d28d9; }

        .measures { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 10px; }
        .measure-item { font-size: 11px; color: var(--text-secondary); }
        .measure-item span { font-weight: 600; color: var(--text-primary); }
        .remark {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 9px;
            border-top: 1px solid var(--border);
            padding-top: 8px;
            line-height: 1.5;
        }

        /* ── MODAL ── */
        .modal-overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.35);
            backdrop-filter: blur(4px);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: #fff;
            border-radius: 16px;
            max-width: 720px;
            width: 95%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 36px;
            position: relative;
            animation: fadeUp 0.28s ease;
        }
        .modal-close {
            position: absolute; top: 18px; right: 22px;
            font-size: 22px; cursor: pointer;
            color: var(--text-muted);
            background: none; border: none;
            transition: color 0.15s;
        }
        .modal-close:hover { color: var(--text-primary); }
        .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
        .modal-img {
            width: 100%;
            border-radius: 10px;
            background: var(--off-white);
            display: flex; align-items: center; justify-content: center;
            color: var(--text-muted); font-size: 13px;
            min-height: 300px; overflow: hidden;
            border: 1px solid var(--border);
        }
        .modal-img img { width: 100%; object-fit: contain; object-position: center top; max-height: 420px; display: block; border-radius: 10px; }
        .modal-info h2 { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
        .modal-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        .modal-table tr td { padding: 6px 8px; font-size: 12px; border-bottom: 1px solid var(--border); }
        .modal-table tr td:first-child { color: var(--text-muted); width: 55%; }
        .modal-table tr td:last-child { font-weight: 600; color: var(--text-primary); }

        /* ── EMPTY STATE ── */
        .empty {
            grid-column: 1/-1;
            padding: 60px 0;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
        }


        /* ── SIZE GUIDE ── */
        .size-guide-section { border-bottom: 1px solid var(--border); background: #fff; }
        .sg-inner { padding: 16px 40px 20px; }
        .sg-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .sg-title { font-size: 16px; font-weight: 700; letter-spacing: 0.5px; color: var(--text-primary); }
        .sg-toggle { background: none; border: 1px solid var(--border); border-radius: 100px; padding: 4px 12px; font-size: 10px; font-weight: 600; color: var(--text-muted); cursor: pointer; font-family: "Noto Sans KR","Noto Sans",sans-serif; }
        .sg-line-btns { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
        .sg-line-btn { padding: 5px 16px; border-radius: 100px; border: 1.5px solid var(--border); font-size: 11px; font-weight: 700; cursor: pointer; background: transparent; color: var(--text-muted); font-family: "Noto Sans KR","Noto Sans",sans-serif; transition: all 0.15s; letter-spacing: 0.5px; }
        .sg-line-btn.active { background: #111; color: #fff; border-color: #111; }
        .sg-line-btn:hover:not(.active) { border-color: #999; color: #555; }
        .sg-content { display: none; }
        .sg-content.active { display: block; }
        .sg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .sg-col-label { font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text-primary); margin-bottom: 6px; }
        .sg-table-wrap { overflow-x: auto; border-radius: 6px; border: 1px solid var(--border); }
        .sg-table { width: 100%; border-collapse: collapse; font-size: 11px; }
        .sg-table thead tr { background: var(--off-white); }
        .sg-table thead th { padding: 8px 12px; text-align: center; font-weight: 700; font-size: 11px; letter-spacing: 0.5px; color: var(--text-muted); border-bottom: 1px solid var(--border); white-space: nowrap; }
        .sg-table thead th:first-child { text-align: left; }
        .sg-table tbody tr { border-bottom: 1px solid var(--border); }
        .sg-table tbody tr:last-child { border-bottom: none; }
        .sg-table tbody tr:hover { background: var(--off-white); }
        .sg-table tbody td { padding: 6px 12px; text-align: center; color: var(--text-primary); font-size: 11px; }
        .sg-table tbody td:first-child { text-align: left; font-weight: 600; color: var(--text-secondary); white-space: nowrap; font-size: 10px; }
        .fit-pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 100px; letter-spacing: 0.5px; cursor: pointer; transition: opacity 0.15s; }
        .fit-pill:hover { opacity: 0.75; }
        .fp-regular   { background: #ccfbf1; color: #0f766e; }
        .fp-semi-over { background: #fef3c7; color: #92400e; }
        .fp-over      { background: #fee2e2; color: #991b1b; }
        .fp-slim      { background: #ede9fe; color: #6d28d9; }
        .fp-sporty    { background: #d1fae5; color: #065f46; }
        @media(max-width: 900px) { .sg-grid { grid-template-columns: 1fr; } }
        @media(max-width: 640px) {
            header { padding: 18px 20px; }
            .hero { padding: 48px 20px 40px; }
            .hero.compact { padding: 16px 20px 0; }
            .results-area { padding: 0 16px 40px; }
            .grid { grid-template-columns: 1fr 1fr; gap: 12px; }
            .card-img { height: 220px; }
            .modal-grid { grid-template-columns: 1fr; }
            .modal { padding: 24px 20px; }
        }
    </style>
</head>
<body>

<!-- LOADING SCREEN -->
<div id="loading-screen">
    <div class="loading-brand">Sergio Tacchini</div>
    <div class="loading-title">👕 Top Fit Guide</div>
    <div class="loading-bar-wrap"><div class="loading-bar"></div></div>
</div>

<header>
    <div>
        <div class="header-brand">Sergio Tacchini</div>
        <div class="header-title"><span class="emoji">👕</span>Top Fit Guide</div>
    </div>
    <div class="header-meta" id="last-updated">Updated: 2026년 04월 27일 16:39</div>
</header>

<!-- FILTERS (hidden - controlled by SIZE GUIDE) -->
<div style="display:none">
    <select id="filter-gender"><option value="">All</option><option value="MEN">MEN</option><option value="WOMEN">WOMEN</option></select>
    <select id="filter-line"><option value="">All</option><option value="RS">RS</option><option value="MT">MT</option><option value="PQ">PQ</option><option value="RL">RL</option><option value="TR">TR</option><option value="WJ">WJ</option><option value="SL">SL</option></select>
    <select id="filter-fit"><option value="">All</option><option value="SLIM">SLIM</option><option value="REGULAR">REGULAR</option><option value="SEMI-OVER">SEMI-OVER</option><option value="OVER">OVER</option></select>
    <input type="text" id="search-input">
</div>


<!-- SIZE GUIDE -->
<div class="size-guide-section" id="size-guide-section">
    <div class="sg-inner">
        <div class="sg-header">
            <div class="sg-title">📏 Fit별 Spec Guide</div>
            <button class="sg-toggle" id="sg-toggle-btn" onclick="toggleGuide()">접기 ▲</button>
        </div>
        <div id="sg-body">
            <div class="sg-line-btns" id="sg-line-btns"></div>
            <div id="sg-panels"></div>
        </div>
    </div>
</div>

<!-- RESULTS -->
<div class="results-area" id="results-area">
    <div class="count-bar"><strong id="count">0</strong>&nbsp;items&nbsp;&nbsp;<button class="btn-reset" onclick="resetAll()" style="margin-left:8px">↺ RESET</button></div>
    <div class="grid" id="grid"></div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay">
    <div class="modal">
        <button class="modal-close" onclick="closeModal()">&times;</button>
        <div class="modal-grid">
            <div id="modal-img-wrap"></div>
            <div class="modal-info">
                <div class="tags" id="modal-tags"></div>
                <h2 id="modal-ref"></h2>
                <div id="modal-remark" style="font-size:12px;color:#999;margin-bottom:10px;"></div>
                <table class="modal-table" id="modal-table"></table>
            </div>
        </div>
    </div>
</div>

<script>
    const DATA = [];
    const safeData = Array.isArray(DATA) ? DATA : [];

    function genderTag(g, ref) {
        // TX- prefix always shows UNISEX tag regardless of stored gender value
        const refStr = String(ref || "").toUpperCase();
        if (refStr.startsWith("TX-")) {
            return `<span class="tag tag-unisex">UNISEX</span>`;
        }
        const cls = g === "WOMEN" ? "tag-women" : "tag-men";
        const label = g === "WOMEN" ? "WOMEN" : "MEN";
        return `<span class="tag ${cls}">${label}</span>`;
    }
    function fitTag(fit) {
        const map = {
            "SLIM":      ["#ede9fe","#6d28d9"],
            "REGULAR":   ["#ccfbf1","#0f766e"],
            "SEMI-OVER": ["#fef3c7","#92400e"],
            "OVER":      ["#fee2e2","#991b1b"]
        };
        if (!map[fit]) return "";
        return `<span class="tag" style="background:${map[fit][0]};color:${map[fit][1]}">${fit}</span>`;
    }

    function renderCards(items) {
        const grid = document.getElementById("grid");
        document.getElementById("count").textContent = items.length;
        if (!items.length) {
            grid.innerHTML = '<div class="empty">검색 결과가 없습니다.</div>';
            return;
        }
        grid.innerHTML = items.map((item, i) => {
            const m = item.measures;
            const delay = Math.min(i * 40, 800);
            return `<div class="card" style="animation-delay:${delay}ms" onclick="openModal('${item.uid || item.ref}')">
                <div class="card-img">
                    <img src="images/${item.ref}.png" alt="${item.ref}"
                         onerror="this.onerror=null;this.parentNode.innerHTML='<div style=&quot;width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#ccc;font-size:12px;&quot;>이미지 없음</div>'">
                </div>
                <div class="card-body">
                    <div class="card-ref">${item.uid || item.ref}</div>
                    <div class="tags">
                        ${genderTag(item.gender, item.ref)}
                        <span class="tag tag-line">${item.line}</span>
                        ${fitTag(item.fit)}
                    </div>
                    <div class="measures">
                        <div class="measure-item">${m["Chest Circumference"] ? "Chest: <span>"+m["Chest Circumference"]+"</span>" : ""}</div>
                        <div class="measure-item">${m["Back Body Length"] ? "CB Length: <span>"+m["Back Body Length"]+"</span>" : ""}</div>
                        <div class="measure-item">${m["Across Shoulder"] ? "Shoulder: <span>"+m["Across Shoulder"]+"</span>" : ""}</div>
                        <div class="measure-item">${m["CB to SLV Length"] ? "CB Sleeve: <span>"+m["CB to SLV Length"]+"</span>" : ""}</div>
                    </div>
                    ${item.remark ? `<div class="remark">${item.remark}</div>` : ""}
                </div>
            </div>`;
        }).join("");
    }

    function applyFilter() {
        const line   = document.getElementById("filter-line").value;
        const gender = document.getElementById("filter-gender").value;
        const fit    = document.getElementById("filter-fit").value;
        const q      = document.getElementById("search-input").value.toLowerCase().trim();
        renderCards(safeData.filter(item => {
            const ref = String(item.ref || "").toUpperCase();
            const isTX = ref.startsWith("TX-");
            // TX- = UNISEX 태그 표시, 하지만 필터는 MEN으로 동작
            const effectiveGender = isTX ? "MEN" : item.gender;
            const genderMatch = !gender || effectiveGender === gender;
            return genderMatch &&
                (!line || item.line === line) &&
                (!fit  || item.fit  === fit)  &&
                (!q    || (item.uid || item.ref).toLowerCase().includes(q));
        }));
    }

    function resetAll() {
        document.getElementById("filter-line").value   = "";
        document.getElementById("filter-gender").value = "";
        document.getElementById("filter-fit").value    = "";
        document.getElementById("search-input").value  = "";
        applyFilter();
    }

    ["filter-line","filter-gender","filter-fit"].forEach(id =>
        document.getElementById(id).addEventListener("change", applyFilter)
    );
    document.getElementById("search-input").addEventListener("input", applyFilter);
    document.getElementById("search-input").addEventListener("keydown", e => {
        if (e.key === "Escape") resetAll();
    });

    // ── SIZE GUIDE ──
    const SG_DATA = {"men": [], "women": []};
    const safeSG = (SG_DATA && Array.isArray(SG_DATA.men)) ? SG_DATA : {men:[], women:[]};
    const FP_CLASS = {"REGULAR":"fp-regular","SEMI-OVER":"fp-semi-over","OVER":"fp-over","SLIM":"fp-slim","SPORTY":"fp-sporty"};

    function buildSgTable(group) {
        const lc = group.lineCode || group.line.split(' ')[0];
        const gc = group.gender || '';
        const fitCols = group.fits.map(f =>
            `<th><span class="fit-pill ${FP_CLASS[f.toUpperCase()]||'fp-regular'}" onclick="filterByFit('${f.toUpperCase()}','${lc}','${gc}')" style="cursor:pointer" title="${lc} ${f} 필터">${f}</span></th>`
        ).join("");
        const allowedPoms = ["Chest Circumference", "Back Body Length"];
        const poms = Object.keys(group.measures).filter(p => allowedPoms.includes(p));
        const bodyRows = poms.map(pom => {
            const cells = group.measures[pom].map(v => `<td>${v}</td>`).join("");
            return `<tr><td>${pom}</td>${cells}</tr>`;
        }).join("");
        return `<div class="sg-table-wrap"><table class="sg-table"><thead><tr><th>POM</th>${fitCols}</tr></thead><tbody>${bodyRows}</tbody></table></div>`;
    }

    function renderSizeGuide() {
        const btnWrap = document.getElementById("sg-line-btns");
        const panelWrap = document.getElementById("sg-panels");
        if (!btnWrap || !panelWrap) return;

        // 공통 LINE 목록 - 고정 순서: RS, RL, MT, PQ, TR, WJ
        const lineOrder = ["RS","RL","MT","PQ","TR","WJ","SL"];
        const lineMap = {};
        [...safeSG.men, ...safeSG.women].forEach(g => {
            const code = g.lineCode || g.line.split(' ')[0];
            if (!lineMap[code]) lineMap[code] = g.line;
        });
        const allLines = lineOrder.filter(c => lineMap[c]).map(c => ({code: c, label: lineMap[c]}));

        btnWrap.innerHTML = allLines.map((l, i) =>
            `<button class="sg-line-btn${i===0?' active':''}" onclick="selectSgLine('${l.code}', this)">${l.code}</button>`
        ).join("");

        panelWrap.innerHTML = allLines.map((l, i) => {
            const menGroup = safeSG.men.find(g => (g.lineCode||g.line.split(/\s+/)[0]) === l.code);
            const womenGroup = safeSG.women.find(g => (g.lineCode||g.line.split(/\s+/)[0]) === l.code);
            if (menGroup) menGroup.gender = 'MEN';
            if (womenGroup) womenGroup.gender = 'WOMEN';
            const menHtml = menGroup ? buildSgTable(menGroup) : '<div style="color:#bbb;font-size:12px;padding:8px">데이터 없음</div>';
            const womenHtml = womenGroup ? buildSgTable(womenGroup) : '<div style="color:#bbb;font-size:12px;padding:8px">데이터 없음</div>';
            return `<div class="sg-content${i===0?' active':''}" data-line="${l.code}">
                <div class="sg-grid">
                    <div><div class="sg-col-label">👔 Men — ${l.label}</div>${menHtml}</div>
                    <div><div class="sg-col-label">👗 Women — ${l.label}</div>${womenHtml}</div>
                </div>
            </div>`;
        }).join("");
    }

    function selectSgLine(code, btn) {
        document.querySelectorAll(".sg-line-btn").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".sg-content").forEach(p => p.classList.remove("active"));
        btn.classList.add("active");
        const panel = document.querySelector(`.sg-content[data-line="${code}"]`);
        if (panel) panel.classList.add("active");
        // LINE 버튼 누르면 gender/fit 필터 초기화 → 남녀 전부 표시
        document.getElementById("filter-line").value = code;
        document.getElementById("filter-gender").value = "";
        document.getElementById("filter-fit").value = "";
        applyFilter();
    }

    function filterByFit(fit, lineCode, gender) {
        if (lineCode) document.getElementById("filter-line").value = lineCode;
        if (gender) document.getElementById("filter-gender").value = gender;
        document.getElementById("filter-fit").value = fit;
        applyFilter();
        document.getElementById("results-area").scrollIntoView({behavior: "smooth"});
    }

    function toggleGuide() {
        const body = document.getElementById("sg-body");
        const btn = document.getElementById("sg-toggle-btn");
        const hidden = body.style.display === "none";
        body.style.display = hidden ? "" : "none";
        btn.textContent = hidden ? "접기 ▲" : "펼치기 ▼";
    }

    // Loading screen → fade out → render cards
    window.addEventListener("DOMContentLoaded", () => {
        setTimeout(() => {
            const ls = document.getElementById("loading-screen");
            ls.classList.add("fade-out");
            setTimeout(() => { ls.style.display = "none"; }, 500);
            renderCards(safeData);
            renderSizeGuide();
        }, 1100);
    });

    function openModal(uid) {
        const item = safeData.find(d => (d.uid || d.ref) === uid);
        if (!item) return;
        document.getElementById("modal-ref").textContent = item.uid || item.ref;
        document.getElementById("modal-img-wrap").innerHTML =
            `<div class="modal-img"><img src="images/${item.ref}.png" alt="${item.ref}"
                onerror="this.onerror=null;this.parentNode.innerHTML='<div style=&quot;width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#ccc;&quot;>이미지 없음</div>'"></div>`;
        document.getElementById("modal-remark").textContent = item.remark || "";
        document.getElementById("modal-tags").innerHTML =
            genderTag(item.gender, item.ref) +
            `<span class="tag tag-line">${item.line}</span>` +
            fitTag(item.fit);
        document.getElementById("modal-table").innerHTML =
            Object.entries(item.measures)
                  .map(([k,v]) => `<tr><td>${k}</td><td>${v}</td></tr>`)
                  .join("");
        document.getElementById("modal-overlay").classList.add("open");
    }

    function closeModal() {
        document.getElementById("modal-overlay").classList.remove("open");
    }
    document.getElementById("modal-overlay").addEventListener("click", e => {
        if (e.target === document.getElementById("modal-overlay")) closeModal();
    });
    document.addEventListener("keydown", e => {
        if (e.key === "Escape") closeModal();
    });
</script>
</body>
</html>
